<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小數學大合集 - 互動積分闖關遊戲</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .game-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .bgm-bar {
            position: absolute;
            top: 15px;
            right: 20px;
        }
        .bgm-btn {
            background: #dfe6e9;
            border: none;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            color: #2d3436;
        }
        .bgm-btn:hover { background: #b2bec3; }

        h2 {
            color: #2c3e50;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #34495e;
        }

        .question-card {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: left;
        }

        .q-category {
            font-size: 13px;
            color: #e17055;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .q-title {
            font-size: 16px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #ffffff;
            color: #2d3436;
            border: 2px solid #b2bec3;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover {
            background-color: #ff7675;
            color: white;
            border-color: #d63031;
        }

        #feedback {
            font-size: 16px;
            font-weight: bold;
            min-height: 25px;
            margin-top: 10px;
            text-align: center;
        }
        .correct { color: #00b894; }
        .incorrect { color: #d63031; }

        .screen { display: none; }
        .screen.active { display: block; }

        .start-btn {
            background-color: #e17055;
            color: white;
            font-size: 18px;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(225, 112, 85, 0.4);
            font-weight: bold;
            margin-top: 15px;
        }
        .start-btn:hover { background-color: #d63031; }
    </style>
</head>
<body>

<div class="game-container" id="main-container">
    <!-- 背景音樂開關 -->
    <div class="bgm-bar">
        <button class="bgm-btn" id="bgm-toggle" onclick="toggleBGM()">🎵 音樂: 關</button>
    </div>

    <!-- 1. 開始畫面 -->
    <div id="start-screen" class="screen active">
        <h2>📐 國小數學大合集闖關遊戲</h2>
        <p style="color: #636e72; font-size: 14px; margin-bottom: 20px;">包含乘法應用、角度計算、數線與分數比大小，共 18 題大挑戰！</p>
        <button class="start-btn" onclick="startGame()">開始挑戰 🚀</button>
    </div>

    <!-- 2. 遊戲進行畫面 -->
    <div id="game-screen" class="screen">
        <h2>✨ 數學綜合大挑戰</h2>
        <div class="stats-bar">
            <span>題目: <span id="current-q">1</span>/18</span>
            <span>積分: <span id="score">0</span></span>
            <span>生命: <span id="lives">❤️❤️❤️</span></span>
        </div>

        <div class="question-card">
            <div class="q-category" id="question-category">類別</div>
            <div class="q-title" id="question-text">載入中...</div>
            <div class="options-container" id="mc-options">
                <!-- 動態生成選項 -->
            </div>
        </div>

        <div id="feedback"></div>
    </div>

    <!-- 3. 結算畫面 -->
    <div id="end-screen" class="screen">
        <h2 id="end-title">🎉 恭喜完成全部挑戰！</h2>
        <p id="end-message" style="font-size: 16px; color: #2d3436; margin: 20px 0;"></p>
        <button class="start-btn" onclick="startGame()">再玩一次 ⭐</button>
    </div>
</div>

<script>
    // 整合全部 18 道題目的題庫
    const allQuestions = [
        // 第一部分：文具店收入計算 (4題)
        { cat: "【第一部分：乘法應用題】", q: "自動鉛筆每枝 45 元。文具店賣出 62 枝自動鉛筆，收入多少元？", options: ["① 2790 元", "② 2625 元", "③ 46800 元", "④ 8400 元"], ans: 0 },
        { cat: "【第一部分：乘法應用題】", q: "削鉛筆機每個 125 元。文具店賣出 21 個削鉛筆機，收入多少元？", options: ["① 2790 元", "② 2625 元", "③ 46800 元", "④ 8400 元"], ans: 1 },
        { cat: "【第一部分：乘法應用題】", q: "計算機每臺 260 元。文具店賣出 180 臺計算機，收入多少元？", options: ["① 2790 元", "② 2625 元", "③ 46800 元", "④ 8400 元"], ans: 2 },
        { cat: "【第一部分：乘法應用題】", q: "書包每個 1680 元。文具店賣出 5 個書包，收入多少元？", options: ["① 2790 元", "② 2625 元", "③ 46800 元", "④ 8400 元"], ans: 3 },

        // 第二部分：角度計算 (6題)
        { cat: "【第二部分：角度計算】", q: "平角上一條射線將其隔開，已知其中一部分是 120°，求 ∠A 是幾度？", options: ["① 60 度", "② 45 度", "③ 155 度", "④ 210 度"], ans: 0 },
        { cat: "【第二部分：角度計算】", q: "直角（90°）內有一條射線，已知其中一部分是 45°，求 ∠B 是幾度？", options: ["① 60 度", "② 45 度", "③ 155 度", "④ 210 度"], ans: 1 },
        { cat: "【第二部分：角度計算】", q: "平角（180°）中，已知一部分是 25°，求 ∠C 是幾度？", options: ["① 60 度", "② 45 度", "③ 155 度", "④ 210 度"], ans: 2 },
        { cat: "【第二部分：角度計算】", q: "已知一個優角（顯露在外側）的角度是 150°，求另一側的 ∠D 是幾度？<br>(提示：360° - 150°)", options: ["① 210 度", "② 270 度", "③ 73 度", "④ 155 度"], ans: 0 },
        { cat: "【第二部分：角度計算】", q: "直角座標交錯中，已知兩個相鄰角度分別為 137° 與 133°，求 ∠E 是幾度？<br>(提示：360° - 90° 或 137 + 133)", options: ["① 210 度", "② 270 度", "③ 73 度", "④ 45 度"], ans: 1 },
        { cat: "【第二部分：角度計算】", q: "已知某個大角被分成兩部分，分別為 53° 與 20°，求合併後的 ∠F 是幾度？", options: ["① 210 度", "② 270 度", "③ 73 度", "④ 155 度"], ans: 2 },

        // 第三部分：數線與分數判斷 (2題)
        { cat: "【第三部分：數線與分數】", q: "在數線上，甲大約在 1.5 左右（即 12/8 位置），請問下列哪一個數比甲大？<br>(選項：9/8, 10/8, 11/8, 12/8)", options: ["① 9/8", "② 10/8", "③ 11/8", "④ 12/8"], ans: 3 },
        { cat: "【第三部分：數線與分數】", q: "在數線上，已知乙在 2.something，丙在 4.something，請問哪一個數比乙大，且比丙小？", options: ["① 3 7/8", "② 37/8 (即 4.625)", "③ 4 6/8", "④ 以上皆非"], ans: 0 },

        // 第四部分：分數比大小 (6題)
        { cat: "【第四部分：分數比大小】", q: "比較大小： 3 7/10  ( ? )  37/10", options: ["① ＞", "② ＝", "③ ＜"], ans: 1 },
        { cat: "【第四部分：分數比大小】", q: "比較大小： 8 4/7  ( ? )  25/7", options: ["① ＞", "② ＝", "③ ＜"], ans: 0 },
        { cat: "【第四部分：分數比大小】", q: "比較大小： 36/9  ( ? )  3 6/9", options: ["① ＞", "② ＝", "③ ＜"], ans: 0 },
        { cat: "【第四部分：分數比大小】", q: "比較大小： 6 4/5  ( ? )  7 1/5", options: ["① ＞", "② ＝", "③ ＜"], ans: 2 },
        { cat: "【第四部分：分數比大小】", q: "比較大小： 3  ( ? )  2 4/6", options: ["① ＞", "② ＝", "③ ＜"], ans: 0 },
        { cat: "【第四部分：分數比大小】", q: "比較大小： 18/8  ( ? )  2 4/8", options: ["① ＞", "② ＝", "③ ＜"], ans: 2 }
    ];

    let currentIndex = 0;
    let score = 0;
    let lives = 3;

    // 音效系統
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playCorrectSound() {
        initAudio();
        if (!audioCtx) return;
        let now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.3, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.25);
        });
    }

    function playWrongSound() {
        initAudio();
        if (!audioCtx) return;
        let now = audioCtx.currentTime;
        [220, 165].forEach((freq, idx) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.25, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.2);
        });
    }

    // 背景音樂
    let bgmInterval = null;
    let isBgmPlaying = false;
    function toggleBGM() {
        initAudio();
        isBgmPlaying = !isBgmPlaying;
        const btn = document.getElementById("bgm-toggle");
        if (isBgmPlaying) {
            btn.innerText = "🎵 音樂: 開";
            startBGM();
        } else {
            btn.innerText = "🎵 音樂: 關";
            stopBGM();
        }
    }

    function startBGM() {
        if (bgmInterval) return;
        const notes = [329.63, 329.63, 392.00, 392.00, 329.63, 329.63, 261.63];
        let index = 0;
        bgmInterval = setInterval(() => {
            if (!isBgmPlaying || !audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(notes[index], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
            index = (index + 1) % notes.length;
        }, 300);
    }

    function stopBGM() {
        if (bgmInterval) {
            clearInterval(bgmInterval);
            bgmInterval = null;
        }
    }

    function startGame() {
        initAudio();
        currentIndex = 0;
        score = 0;
        lives = 3;

        document.getElementById("start-screen").classList.remove("active");
        document.getElementById("end-screen").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");

        loadQuestion();
    }

    function loadQuestion() {
        if (lives <= 0) {
            endGame(false);
            return;
        }
        if (currentIndex >= allQuestions.length) {
            endGame(true);
            return;
        }

        const item = allQuestions[currentIndex];

        document.getElementById("current-q").innerText = currentIndex + 1;
        document.getElementById("score").innerText = score;
        document.getElementById("lives").innerText = "❤️".repeat(lives);
        document.getElementById("question-category").innerText = item.cat;
        document.getElementById("question-text").innerHTML = item.q;
        document.getElementById("feedback").innerText = "";

        const mcOptions = document.getElementById("mc-options");
        mcOptions.innerHTML = "";
        item.options.forEach((opt, idx) => {
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, item.ans);
            mcOptions.appendChild(btn);
        });
    }

    function checkAnswer(userIndex, correctIndex) {
        const feedbackEl = document.getElementById("feedback");

        if (userIndex === correctIndex) {
            playCorrectSound();
            feedbackEl.className = "correct";
            feedbackEl.innerText = "✨ 太棒了！答對囉！ +10 分";
            score += 10;
            document.getElementById("score").innerText = score;

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        } else {
            handleWrong();
        }
    }

    function handleWrong() {
        playWrongSound();
        lives--;
        document.getElementById("lives").innerText = "❤️".repeat(lives);
        
        const container = document.getElementById("main-container");
        container.classList.remove("shake");
        void container.offsetWidth;
        container.classList.add("shake");

        const feedbackEl = document.getElementById("feedback");
        feedbackEl.className = "incorrect";
        if (lives > 0) {
            feedbackEl.innerText = `❌ 哎呀選錯了，再試一次看看！還剩 ${lives} 條命。`;
        } else {
            endGame(false);
        }
    }

    function endGame(isWin) {
        document.getElementById("game-screen").classList.remove("active");
        document.getElementById("end-screen").classList.add("active");
        const endTitle = document.getElementById("end-title");
        const endMessage = document.getElementById("end-message");

        if (isWin) {
            endTitle.innerText = "🏆 太厲害了！全部題目挑戰成功！";
            endMessage.innerHTML = `你順利完成了所有 18 道數學題！<br>最終獲得總積分：<b>${score}</b> 分 ⭐`;
        } else {
            endTitle.innerText = "💥 挑戰失敗";
            endMessage.innerHTML = `生命值用完囉！不要氣餒，再算一次計算紙挑戰一次吧！<br>最終得分：<b>${score}</b> 分`;
        }
    }
</script>

</body>
</html>
